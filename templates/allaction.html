<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Action Movies - Movie Recommender</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" />

    <!-- Auto Complete -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@7.2.0/dist/css/autoComplete.min.css" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}" />

    <script type="text/javascript">
        var films = {{ suggestions|tojson }};
    </script>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 0;
        }

        #movies-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px;
            margin: 35px auto;
            max-width: 1200px;
        }

        .movie-card {
            background-color: #333;
            color: white;
            border-radius: 10px;
            width: calc(20% - 20px);
            height: 400px;
            text-align: center;
            box-sizing: border-box;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .movie-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-bottom: 1px solid #444;
        }

        .movie-card h3 {
            margin: 10px 0 0;
            font-size: 1em;
            margin-left: 10px;
            margin-right: 10px;
        }

        .watchlist {
            position: relative;
            top: -5px;
            left: -120px;
            gap: 8px;
            display: flex;
            align-items: center;
            background-color: #333333;
            border-radius: 8px;
            transition: 0.3s;
            padding: 10px;
            color: #fff;
            font-size: 18px;
            width: fit-content;
        }

        .watchlist:hover {
            box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
        }

        .watchlist p {
            margin: 0;
            margin-right: 10px;
        }

        .watchlist img {
            display: block;
            filter: invert(1);
            width: 30px;
            height: auto;
        }

        .genres {
            padding: 2px 16px;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                height: auto !important;
                padding: 15px 10px;
            }
            .search-container {
                width: 90% !important;
            }
            .movie-button {
                position: static !important;
                margin-top: 10px;
            }
            .watchlist, .genres {
                left: 0 !important;
            }
            #movies-container {
                justify-content: center;
            }
            .movie-card {
                width: calc(50% - 10px);
                height: 220px;
            }
            .movie-card img {
                height: 140px;
            }
        }
    </style>
</head>
<body id="content">
    <!-- Top Navigation Bar -->
    <nav class="form-group shadow-textarea" style="text-align: center; color: white; display: flex; justify-content: center; align-items: center; background-color: #333333; height: 12vh; margin-bottom: 0;">
        <div class="search-container" style="position: relative;">
            <input type="text" name="movie" class="movie form-control" id="autoComplete" autocomplete="off" placeholder="Enter the Movie Name" style="background-color: #ffffff; border-color:#ffffff; width: 60%; color: #181818; border-radius: 5px;" required="required" />
            <ul id="movie_list"></ul>
        </div>
        <div class="form-group" style="text-align: center;">
            <button class="btn btn-primary btn-block movie-button" style="background-color: #e50914; text-align: center; border-color: #e50914; width:120px; position: relative; left: -155px; top: 30px;" disabled="true">Enter</button>
        </div>
        <div style="color: white; position: relative; left: -125px; top: -5px;"> | </div>
        <div class="watchlist" style="cursor: pointer;" onclick="window.location.href='/watchlist';">
            <img src="{{ url_for('static', filename='images/add_bookmark.svg') }}" width="30px" height="auto" alt="Watchlist">
            <p>WatchList</p>
        </div>
        <div class="genres" style="color: white; position: relative; left: -120px; top: -5px; cursor: pointer;" onclick="window.location.href='/genres'">Genre-Wise</div>
    </nav>

    <!-- Loader & Search Results -->
    <div id="loader" style="text-align: center; display: none;">
        <p id="loader-text" style="color: white; font-size:20px; font-weight: 800;">LOADING...</p>
    </div>
    <div class="fail" style="display: none; text-align: center; margin-top: 30px;">
        <h3 style="color: #ffffff;">Sorry! The movie you requested is not in our database.</h3>
    </div>
    <div class="results"></div>

    <div id="genre-main-content">
        <center><h1 style="color: #e50914; margin-top: 25px;">All Action Movies</h1></center>
        <div id="movies-container"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@7.2.0/dist/js/autoComplete.min.js"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='autocomplete.js') }}"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='recommend.js') }}"></script>

    <script>
        window.onload = function() {
            const movies = {{ movies|tojson if movies is not none else '[]' }};
            const tmdbApiKey = 'fce0af3409e6113c9b3c75aaf49341bb';
            get_movie_posters(movies, tmdbApiKey);
        };

        function get_movie_posters(arr, my_api_key) {
            var tmdbApiUrl = 'https://api.tmdb.org/3/search/movie?api_key=' + my_api_key + '&query=';

            arr.forEach(function(movieTitle) {
                const searchUrl = tmdbApiUrl + encodeURIComponent(movieTitle);

                fetch(searchUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status} - ${response.statusText}`);
                        }
                        return response.json();
                    })
                    .then(m_data => {
                        const container = document.getElementById('movies-container');
                        if (!container) return;

                        if (m_data.results && m_data.results.length > 0 && m_data.results[0].poster_path) {
                            var posterUrl = 'https://image.tmdb.org/t/p/original' + m_data.results[0].poster_path;
                            var voteAverage = m_data.results[0].vote_average;
                            displayMovieCard(movieTitle, posterUrl, voteAverage);
                        } else {
                            displayMovieCard(movieTitle, 'placeholder_image_url', 0);
                        }
                    })
                    .catch(error => {
                        console.error("Error fetching movie data:", error);
                    });
            });
        }

        function displayMovieCard(title, posterUrl, voteAverage) {
            const container = document.getElementById('movies-container');
            const movieCard = `
                <div class="movie-card" onclick="window.location.href='/movie/${encodeURIComponent(title)}'">
                    <img src="${posterUrl}" alt="${title} poster" />
                    <p>★ ${voteAverage}</p>
                    <h3>${title}</h3>
                </div>
            `;

            if (container) {
                container.innerHTML += movieCard;
            }
        }
    </script>
</body>
</html>
