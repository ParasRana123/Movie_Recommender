<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genres</title>
    <style>
        .genres-card {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 30px; /* More space between cards */
            max-width: 1400px; /* Increased max width */
            margin: auto;
            padding: 30px;
        }

        .card {
            width: 320px; /* Increased width */
            height: 280px; /* Increased height */
            box-shadow: 0px 4px 20px rgba(250, 250, 250, 1);
            border-radius: 20px;
            transition: 0.3s;
            background-color: #333;
            color: white;
            text-align: center;
            overflow: hidden; /* Ensures nothing overflows */
            cursor: pointer;
        }

        .card:hover {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .card-img {
            width: 100%; 
            height: 180px; /* Increased height */
            object-fit: cover; /* Ensures proper fit */
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .genres {
            padding: 15px;
            font-size: 20px; /* Bigger font */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="genres-card">
        <div class="card" onclick="window.location.href='/action';">
            <img src="{{ url_for('static', filename='images/action1.jpg') }}" alt="Action" class="card-img">
            <div class="genres"><p>Action</p></div>
        </div>

        <div class="card" onclick="window.location.href='/horror';">
            <img src="{{ url_for('static', filename='images/horror.jpg') }}" alt="Horror" class="card-img">
            <div class="genres"><p>Horror</p></div>
        </div>

        <div class="card" onclick="window.location.href='/romance';">
            <img src="{{ url_for('static', filename='images/Romance.jpg') }}" alt="Romance" class="card-img">
            <div class="genres"><p>Romance</p></div>
        </div>

        <div class="card" onclick="window.location.href='/mystery';">
            <img src="{{ url_for('static', filename='images/mystery.jpg') }}" alt="Mystery" class="card-img">
            <div class="genres"><p>Mystery</p></div>
        </div>

        <div class="card" onclick="window.location.href='/history';">
            <img src="{{ url_for('static', filename='images/history.jpg') }}" alt="History" class="card-img">
            <div class="genres"><p>History</p></div>
        </div>

        <div class="card" onclick="window.location.href='/thriller';">
            <img src="{{ url_for('static', filename='images/Thriller.jpg') }}" alt="Thriller" class="card-img">
            <div class="genres"><p>Thriller</p></div>
        </div>

        <div class="card" onclick="window.location.href='/comedy';">
            <img src="{{ url_for('static', filename='images/Comedy.jpg') }}" alt="Comedy" class="card-img">
            <div class="genres"><p>Comedy</p></div>
        </div>

        <div class="card" onclick="window.location.href='/fantasy';">
            <img src="{{ url_for('static', filename='images/fantasy.jpg') }}" alt="Fantasy" class="card-img">
            <div class="genres"><p>Fantasy</p></div>
        </div>

        <div class="card" onclick="window.location.href='/adventure';">
            <img src="{{ url_for('static', filename='images/Adventure.jpg') }}" alt="Adventure" class="card-img">
            <div class="genres"><p>Adventure</p></div>
        </div>

        <div class="card" onclick="window.location.href='/documentary';">
            <img src="{{ url_for('static', filename='images/Documentary.jpg') }}" alt="Documentary" class="card-img">
            <div class="genres"><p>Documentary</p></div>
        </div>

        <div class="card" onclick="window.location.href='/sci_fi';">
            <img src="{{ url_for('static', filename='images/Sci-Fi.jpg') }}" alt="Sci-Fi" class="card-img">
            <div class="genres"><p>Sci-Fi</p></div>
        </div>
    </div>
</body>
</html>
