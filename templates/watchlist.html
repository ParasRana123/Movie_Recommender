<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Watchlist - Movie Recommender</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/bookmark_tick.svg') }}">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
  
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  
    <!-- Auto Complete -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@7.2.0/dist/css/autoComplete.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    
    <script type="text/javascript">
        var films = {{ suggestions|tojson }};
    </script>
    
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 0;
        }

        .your_watchlist {
            width: 100%;
            max-width: 1200px;
            padding: 30px 20px 10px 20px;
            box-sizing: border-box;
            margin: 0 auto;
            text-align: center;
        }

        .your_watchlist h1 {
            color: #e50914;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .your_watchlist p {
            color: #b3b3b3;
            font-size: 16px;
            max-width: 700px;
            margin: 0 auto 25px auto;
        }

        .search-container {
            position: relative;
            width: 60%;
        }

        #movie_list {
            max-height: 200px;
            overflow-y: auto;
            background-color: white;
            padding: 0;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            z-index: 1000;
            margin-top: 5px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #movie_list li {
            padding: 10px;
            cursor: pointer;
            list-style-type: none;
            margin: 0;
            color: #222;
        }

        #movie_list li:hover {
            background-color: #f0f0f0;
        }

        .watchlist {
            position: relative;
            top: -5px;
            left: -120px;
            gap: 8px;
            display: flex;
            align-items: center;
            background-color: #e50914;
            border-radius: 8px;
            transition: 0.3s;
            padding: 10px 16px;
            color: #fff;
            font-size: 18px;
            width: fit-content;
        }

        .watchlist:hover {
            box-shadow: 0 8px 16px 0 rgba(0 , 0 , 0 , 0.2);
        }

        .watchlist p {
            margin: 0;
            margin-right: 10px;
        }

        .watchlist img {
            display: block;
            filter: invert(1);
            width: 25px;
            height: auto;
        }

        #watchlist-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .movie-card {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            background-color: #1a1a1a;
            border: 1px solid #2e2e2e;
            border-radius: 12px;
            padding: 16px 20px;
            position: relative;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            text-align: left;
        }

        .movie-card:hover {
            transform: translateY(-2px);
            border-color: rgba(229, 9, 20, 0.45);
            box-shadow: 0 8px 24px rgba(229, 9, 20, 0.2);
        }

        .movie-poster-wrap {
            position: relative;
            flex-shrink: 0;
            width: 96px;
            height: 142px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background-color: #222222;
        }

        .watchlist-poster-ribbon {
            position: absolute;
            top: 0;
            left: 0;
            width: 24px;
            height: 32px;
            background-color: #e50914;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
            z-index: 3;
            font-weight: bold;
            font-size: 13px;
        }

        .movie-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.25s ease;
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.04);
        }

        .movie-info-wrap {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .watchlist-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .movie-title {
            color: #ffffff;
            font-size: 19px;
            font-weight: 700;
            margin: 0;
            cursor: pointer;
            line-height: 1.3;
            transition: color 0.2s;
        }

        .movie-title:hover {
            color: #e50914;
        }

        .movie-meta-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            color: #a0a0a0;
            font-size: 13.5px;
            font-weight: 500;
        }

        .meta-dot {
            opacity: 0.5;
            font-size: 11px;
        }

        .movie-overview-text {
            color: #cccccc;
            font-size: 13.5px;
            line-height: 1.55;
            margin: 2px 0 4px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .watchlist-credits-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            margin-top: 2px;
        }

        .watchlist-credit-group {
            display: flex;
            gap: 8px;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .credit-label {
            font-weight: 700;
            color: #ffffff;
            min-width: 55px;
        }

        .credit-name {
            color: #94a3b8;
        }

        .highlight-link {
            color: #38bdf8;
            cursor: pointer;
        }

        .highlight-link:hover {
            color: #e50914;
            text-decoration: underline;
        }

        .watchlist-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .action-btn {
            background: transparent;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #888888;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            color: #e50914;
            background-color: rgba(229, 9, 20, 0.12);
        }

        .empty-watchlist {
            text-align: center;
            padding: 60px 20px;
            color: #888888;
        }

        .empty-watchlist h3 {
            color: #cccccc;
            margin-bottom: 15px;
        }

        .explore-btn {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: inline-block;
            text-decoration: none;
        }

        .explore-btn:hover {
            background-color: #ff1e2b;
            color: white;
            text-decoration: none;
        }

        .undo-message {
            display: none;
            background-color: #222222;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            margin: 10px 0;
            text-align: center;
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #444;
        }

        .undo-btn {
            color: #e50914;
            font-weight: bold;
            cursor: pointer;
            margin-left: 12px;
            display: inline-block;
        }

        .undo-btn:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .movie-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .watchlist, .genres {
                left: 0 !important;
            }
        }
    </style>
</head>
<body id="content">
    <!-- Top Navigation Bar -->
    <nav class="form-group shadow-textarea" style="text-align: center; color: white; display: flex; justify-content: center; align-items: center; background-color: #333333; height: 12vh; margin-bottom: 0;">
        <div class="search-container" style="position: relative;">
            <input type="text" name="movie" class="movie form-control" id="autoComplete" autocomplete="off" placeholder="Enter the Movie Name" style="background-color: #ffffff; border-color:#ffffff; width: 60%; color: #181818; border-radius: 5px;" required="required" />
            <ul id="movie_list"></ul>
        </div>
        <div class="form-group" style="text-align: center;">
            <button class="btn btn-primary btn-block movie-button" style="background-color: #e50914; text-align: center; border-color: #e50914; width:120px; position: relative; left: -155px; top: 30px;" disabled="true">Enter</button>
        </div>
        <div style="color: white; position: relative; left: -125px; top: -5px;"> | </div>
        <div class="watchlist" style="cursor: pointer;" onclick="window.location.href='/watchlist';">
            <img src="{{ url_for('static', filename='images/add_bookmark.svg') }}" width="25px" height="auto" alt="Watchlist">
            <p>WatchList</p>
        </div>
        <div class="genres" style="color: white; position: relative; left: -120px; top: -5px; cursor: pointer;" onclick="window.location.href='/genres'">Genre-Wise</div>
    </nav>

    <!-- Loader & Search Results -->
    <div id="loader" style="text-align: center; display: none;">
        <p id="loader-text" style="color: white; font-size:20px; font-weight: 800;">LOADING...</p>
    </div>
    <div class="fail" style="display: none; text-align: center; margin-top: 30px;">
        <h3 style="color: #ffffff;">Sorry! The movie you requested is not in our database.</h3>
    </div>
    <div class="results"></div>

    <div id="page-main-content">
        <div class="your_watchlist">
            <h1>Your Watchlist</h1>
            <p>Track all the movies you want to watch. Easily jump right back into any title or view recommendations.</p>
        </div>

        <div id="watchlist-container">
            <!-- Watchlist movie cards inserted dynamically -->
        </div>
    </div>

    <!-- Undo toast popup -->
    <div class="undo-message" id="undo-message">
        <span>Movie removed from Watchlist.</span>
        <span class="undo-btn" id="undo-btn">Undo</span>
    </div>

    <script>
        let lastRemovedMovie = null;
        let lastRemovedIndex = null;

        function renderWatchlist() {
            const watchlist = JSON.parse(localStorage.getItem('watchlist')) || [];
            const container = document.getElementById('watchlist-container');

            if (!container) return;

            if (watchlist.length === 0) {
                container.innerHTML = `
                    <div class="empty-watchlist">
                        <h3>Your Watchlist is empty</h3>
                        <p>Search for movies or browse genres and click "Add to Watchlist" to save them here.</p>
                        <a href="/home" class="explore-btn">Discover Movies</a>
                    </div>
                `;
            } else {
                container.innerHTML = '';
                watchlist.forEach((movie, index) => {
                    const movieCard = document.createElement('div');
                    movieCard.classList.add('movie-card');

                    const year = movie.date || movie.release_date || '';
                    const runtime = movie.runtime && movie.runtime !== 'N/A' ? movie.runtime : '';
                    const genres = movie.genres || '';
                    const rawCasts = Array.isArray(movie.casts) ? movie.casts : (typeof movie.casts === 'string' ? movie.casts.split(',') : []);
                    const parsedCasts = rawCasts.map(c => {
                        if (typeof c === 'string') return { name: c.trim(), id: '' };
                        return { name: c.name || '', id: c.id ? String(c.id) : '' };
                    }).filter(c => Boolean(c.name));

                    movieCard.innerHTML = `
                        <div class="movie-poster-wrap" onclick="window.location.href='/movie/${encodeURIComponent(movie.title)}'">
                            <div class="watchlist-poster-ribbon" title="In Watchlist">✓</div>
                            <img src="${movie.poster || 'https://via.placeholder.com/140x210?text=No+Poster'}" alt="${movie.title} Poster" class="movie-poster" onerror="this.src='https://via.placeholder.com/140x210?text=No+Poster'">
                        </div>
                        <div class="movie-info-wrap">
                            <div class="watchlist-header-row">
                                <h2 class="movie-title" onclick="window.location.href='/movie/${encodeURIComponent(movie.title)}'">
                                    <span>${index + 1}. </span><span>${movie.title}</span>
                                </h2>
                                <div class="watchlist-actions">
                                    <button class="action-btn" title="View Details" onclick="window.location.href='/movie/${encodeURIComponent(movie.title)}'">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                                    </button>
                                    <button class="action-btn" title="Remove from Watchlist" onclick="removeFromWatchlist(${index})">✕</button>
                                </div>
                            </div>
                            <div class="movie-meta-row">
                                ${year ? `<span>${year}</span>` : ''}
                                ${year && runtime ? `<span class="meta-dot">•</span>` : ''}
                                ${runtime ? `<span>${runtime}</span>` : ''}
                                ${(year || runtime) && genres ? `<span class="meta-dot">•</span>` : ''}
                                ${genres ? `<span>${genres}</span>` : ''}
                            </div>
                            <p class="movie-overview-text">${movie.overview || 'No overview available.'}</p>
                            ${director || parsedCasts.length > 0 ? `
                                <div class="watchlist-credits-row">
                                    ${director ? `<div class="watchlist-credit-group"><span class="credit-label">Director</span><span class="credit-name highlight-link" onclick="window.location.href='/actor/${encodeURIComponent(director)}'">${director}</span></div>` : ''}
                                    ${parsedCasts.length > 0 ? `
                                        <div class="watchlist-credit-group">
                                            <span class="credit-label">Stars</span>
                                            <span class="credit-name">
                                                ${parsedCasts.slice(0, 4).map((c, i) => `<span class="highlight-link" title="View details for ${c.name}" onclick="window.location.href='/actor/${encodeURIComponent(c.id || c.name)}'">${c.name}</span>${i < Math.min(parsedCasts.length, 4) - 1 ? ', ' : ''}`).join('')}
                                            </span>
                                        </div>
                                    ` : ''}
                                </div>
                            ` : ''}
                        </div>
                    `;

                    container.appendChild(movieCard);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', renderWatchlist);

        function showUndoMessage() {
            const undoMessageElement = document.getElementById('undo-message');
            if (undoMessageElement) {
                undoMessageElement.style.display = 'block';
                setTimeout(() => {
                    undoMessageElement.style.display = 'none';
                    lastRemovedMovie = null;
                    lastRemovedIndex = null;
                }, 3500);
            }
        }

        const undoBtn = document.getElementById('undo-btn');
        if (undoBtn) {
            undoBtn.addEventListener('click', function() {
                if (lastRemovedMovie && lastRemovedIndex !== null) {
                    let watchlist = JSON.parse(localStorage.getItem('watchlist')) || [];
                    watchlist.splice(lastRemovedIndex, 0, lastRemovedMovie);
                    localStorage.setItem('watchlist', JSON.stringify(watchlist));

                    renderWatchlist();
                    lastRemovedMovie = null;
                    lastRemovedIndex = null;
                    const undoMessageElement = document.getElementById('undo-message');
                    if (undoMessageElement) undoMessageElement.style.display = 'none';
                }
            });
        }

        function removeFromWatchlist(index) {
            let watchlist = JSON.parse(localStorage.getItem('watchlist')) || [];
            lastRemovedMovie = watchlist.splice(index, 1)[0];
            lastRemovedIndex = index;
            localStorage.setItem('watchlist', JSON.stringify(watchlist));

            renderWatchlist();
            showUndoMessage();
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@7.2.0/dist/js/autoComplete.min.js"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='autocomplete.js') }}"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='recommend.js') }}"></script>
</body>
</html>
