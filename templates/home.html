  <style>
    .search-container {
    position: relative;
    width: 60%; /* Adjust as needed */
}

#movie_list {
    max-height: 200px; /* Adjust the height as needed */
    overflow-y: auto;
    background-color: white;
    padding: 0; /* Remove any padding */
    position: absolute;
    top: 100%; /* Position the list below the input */
    left: 0;
    width: 100%; /* Make it the same width as the input */
    z-index: 1000; /* Ensure it appears above other elements */
    margin-top: 5px; /* Add a small gap between the input and the list */
    border-radius: 5px; /* Optional: Add some rounded corners */
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Optional: Add a shadow */
}

#movie_list li {
    padding: 10px;
    cursor: pointer;
    list-style-type: none; /* Remove bullet points */
    margin: 0; /* Remove any margin */
}

#movie_list li:hover {
    background-color: #f0f0f0;
}

    #top_movies {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
    
    .top-movie-card {
        width: 15rem;
        margin: 1rem;
        text-align: center;
        color: #fff;
    }

    .top-movie-card img {
        border-radius: 10px;
    }

    .top-movie-card h5 {
        margin: 0.3rem 0;
        color: black;
    }

    .top-movie-card p {
      margin: 0.3rem;
      color: black;
    }

    /* Genre card styling */
.genre-card {
  background-color: #333;
  color: white;
  text-align: center;
  border-radius: 10px;
  transition: all 0.3s ease-in-out;
  padding: 10px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
}

.genre-card:hover {
  background-color: #555;
  transform: scale(1.05);
}

/* Genre card image styling */
.genre-card img {
  max-width: 100%;
  border-radius: 10px;
  margin-bottom: 10px;
}

.pi {
  padding-left: 39%;

.scroll-container {
  display: flex;
  align-items: center;
}

.scrollmenu { 
  display: flex;
  overflow-x: auto;
  scroll-behavior: smooth;
  white-space: nowrap;
  flex-grow: 1;
  scrollbar-width: 10px; /* Firefox */
}

.scroll-button {
  background-color: #333;
  color: white;
  border: none;
  padding: 10px;
  cursor: pointer;
  font-size: 18px;
  border-radius: 5px;
  user-select: none;
}

.left {
  margin-right: 10px;
}

.right {
  margin-left: 10px;
}

/* .scrollmenu::-webkit-scrollbar {

.genres-card {
  display: flex;

.card {
  width: 300px;
  height: auto;
  box-shadow: 0px 1px 15px 4px rgba(250, 250, 250, 1);
  border-radius: 20px;
  transition: 0.3s;
  background-color: #333;
  color: white;
  margin: 20px;

}

.card:hover {
  box-shadow: 0 8px 16px 0 rgba(0 , 0 , 0 , 0.2);
}

.genres {
  padding: 2px 16px;
}

.action-img {
  max-width: 300px;
  height: auto;
  border-radius: 15px;
}

.horror-img {
  max-width: 350px;
  height: 166px;
  border-radius: 15px;
}

.scroll-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.watchlist {
  position: relative;
  top: -5px;
  left: -120px;
  gap: 8px;
  display: flex;
  align-items: center; /* Align text and image vertically */
  background-color: #333333; /* Dark background */
  /* box-shadow: 0px 1px 15px 4px rgba(250, 250, 250, 1); */
  border-radius: 20px;
  transition: 0.3s;
  padding: 10px;
  border-radius: 8px; /* Rounded corners */
  color: #fff; /* White text for contrast */
  font-size: 18px; /* Adjust font size */
  width: fit-content; /* Adjust width to content */
}

.watchlist:hover {
  box-shadow: 0 8px 16px 0 rgba(0 , 0 , 0 , 0.2);
}

.watchlist p {
  margin: 0; /* Remove default margin from <p> */
  margin-right: 10px; /* Add some space between text and image */
  /* font-weight: bold; Make text bold */
}

.watchlist img {
  display: block; /* Ensure the image is not affected by line-height */
  filter: invert(1); /* Invert colors for better visibility on dark background */
  width: 30px; /* Set the width of the image */
  height: auto; /* Keep aspect ratio */
}

.from_watchlist {
  padding: 10px;
  margin-left: 20px;
}

.movie-card {
            /* display: flex; */

        }

        .movie-status {
            padding-left: 21px;

        .movie-date {

        .movie-runtime {

        .movie-rating {

        .delete-btn1 {
            position: absolute;
            top: 0px;
            right: 209px;

            width: 30px;
            height: 37px;

            align-items: center;

        }

        .delete-btn {
            position: absolute;

            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .message {
            display: none;
            background-color: #28a745;
            color: #ffffff;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
        }

        .undo-message {
            display: none;
            background-color: #333;
            color: #ffffff;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            position: fixed;
            bottom: 20px;
            left: 10%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .undo-btn {
            color: rgb(4, 4, 255);
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 10px;
        }

        .undo-btn:hover {
            background-color: #585858;
            border-radius: 5px;
        }
