<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
  
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  
    <!-- Auto Complete -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@7.2.0/dist/css/autoComplete.min.css">
    <link rel= "stylesheet" type= "text/css" href= "{{ url_for('static',filename='style.css') }}">
    <title>{{ actor.name }} - IMDb</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        .actor-container {
            display: flex;
            gap: 20px;
            background-color: #1c1c1c;
            padding: 20px;
            border-radius: 8px;
        }
        .actor-profile {
            width: 300px;
            border-radius: 8px;
        }
        .details h1 {
            color: #f5c518;
            margin-bottom: 5px;
        }
        .details h3 {
            margin: 5px 0;
            color: #bbb;
        }
        .details p {
            line-height: 1.5;
        }
        .movies-list {
            margin-top: 40px;
        }
        .movies-list h3 {
            text-align: center;
            font-size: 24px;
            color: #f5c518;
        }
        .movie-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .movie-item {
            background-color: #222;
            padding: 15px;
            border-radius: 8px;
            width: 220px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .movie-item:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(245, 197, 24, 0.3);
        }
        .movie-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }
        .character-name {
            font-size: 16px;
            color: #bbb;
            font-style: italic;
        }
        .movie-poster {
            width: 100%;
            border-radius: 8px;
        }

        .watchlist {
  position: relative;
  top: -5px;
  left: -120px;
  gap: 8px;
  display: flex;
  align-items: center; /* Align text and image vertically */
  background-color: #333333; /* Dark background */
  /* box-shadow: 0px 1px 15px 4px rgba(250, 250, 250, 1); */
  border-radius: 20px;
  transition: 0.3s;
  padding: 10px;
  border-radius: 8px; /* Rounded corners */
  color: #fff; /* White text for contrast */
  font-size: 18px; /* Adjust font size */
  width: fit-content; /* Adjust width to content */
}

.watchlist:hover {
  box-shadow: 0 8px 16px 0 rgba(0 , 0 , 0 , 0.2);
}

.watchlist p {
  margin: 0; /* Remove default margin from <p> */
  margin-right: 10px; /* Add some space between text and image */
  /* font-weight: bold; Make text bold */
}

.watchlist img {
  display: block; /* Ensure the image is not affected by line-height */
  filter: invert(1); /* Invert colors for better visibility on dark background */
  width: 30px; /* Set the width of the image */
  height: auto; /* Keep aspect ratio */
}

.from_watchlist {
  padding: 10px;
  margin-left: 20px;
}

#movie_list {
    max-height: 200px; /* Adjust the height as needed */
    overflow-y: auto;
    background-color: white;
    padding: 0; /* Remove any padding */
    position: absolute;
    top: 100%; /* Position the list below the input */
    left: 0;
    width: 100%; /* Make it the same width as the input */
    z-index: 1000; /* Ensure it appears above other elements */
    margin-top: 5px; /* Add a small gap between the input and the list */
    border-radius: 5px; /* Optional: Add some rounded corners */
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Optional: Add a shadow */
}

#movie_list li {
    padding: 10px;
    cursor: pointer;
    list-style-type: none; /* Remove bullet points */
    margin: 0; /* Remove any margin */
}

#movie_list li:hover {
    background-color: #f0f0f0;
}
    </style>
</head>
<body>
    <nav class="form-group shadow-textarea" style="text-align: center;color: white; display: flex; justify-content: center; align-items: center; background-color: #333333; height: 12vh;">
        <div class="search-container" style="position: relative;">
            <input type="text" name="movie" class="movie form-control" id="autoComplete" autocomplete="off" placeholder="Enter the Movie Name" style="background-color: #ffffff;border-color:#ffffff;width: 60%;color: #181818; border-radius: 5px;" required="required" />
            <ul id="movie_list"></ul>
        </div>
        <div class="form-group" style="text-align: center;">
            <button class="btn btn-primary btn-block movie-button" style="background-color: #e50914;text-align: center;border-color: #e50914;width:120px; position: relative; left: -155px; top: 30px;" disabled="true">Enter</button><br><br>
        </div>
        <div style="color: white;position: relative;left: -125px;top: -5px;"> | </div>
        <div class="watchlist" style="cursor: pointer;" onclick="window.location.href='/watchlist';">
            <img src="{{ url_for('static', filename='images/add_bookmark.svg') }}" width="30px" height="auto" alt="">
            <p>WatchList</p>
        </div>
        <!-- <div style="color: white;position: relative;left: -120px;top: -5px;"> | </div> -->
        <div class="genres" style="color: white;position: relative;left: -120px;top: -5px; cursor: pointer;" onclick="window.location.href='/genres'">Genre-Wise</div>
    </nav>
    <div class="container">
        <div class="actor-container">
            <img src="{{ actor.profile }}" alt="{{ actor.name }}" class="actor-profile">
            <div class="details">
                <h1>{{ actor.name }}</h1>
                <h3>Born: {{ actor.birthday }}</h3>
                <h3>Birthplace: {{ actor.birth_place }}</h3>
                <h2>Biography</h2>
                <p>{{ actor.biography }}</p>
            </div>
        </div>

        <div class="movies-list">
            <h3>Known For</h3>
            <div class="movie-container" id="movies-list">
                {% for movie in movies %}
                    <div class="movie-item" id="movie-{{ loop.index }}" onclick="showMovieDetails('{{ movie }}')">
                        <!-- Movie content will be added dynamically -->
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        const movieTitles = {{ movies | tojson | safe }};
        const actorName = "{{ actor.name }}";
        const apiKey = 'fce0af3409e6113c9b3c75aaf49341bb';

        async function fetchActorId() {
            try {
                const searchUrl = `https://api.tmdb.org/3/search/person?api_key=${apiKey}&query=${encodeURIComponent(actorName)}`;
                const response = await fetch(searchUrl);
                const data = await response.json();
                return data.results.length > 0 ? data.results[0].id : null;
            } catch (error) {
                console.error("Error fetching actor ID:", error);
                return null;
            }
        }

        async function fetchActorMovies(actorId) {
            if (!actorId) return [];
            try {
                const creditsUrl = `https://api.tmdb.org/3/person/${actorId}/movie_credits?api_key=${apiKey}`;
                const response = await fetch(creditsUrl);
                const data = await response.json();
                return data.cast || [];
            } catch (error) {
                console.error("Error fetching actor's movie credits:", error);
                return [];
            }
        }

        async function fetchMovieData(movieTitle, index, movieCredits) {
            try {
                const movieData = movieCredits.find(movie => movie.title.toLowerCase() === movieTitle.toLowerCase());
                const characterName = movieData ? movieData.character : "Unknown Role";
                const searchUrl = `https://api.tmdb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(movieTitle)}`;
                const response = await fetch(searchUrl);
                const data = await response.json();
                if (data.results.length > 0) {
                    const movie = data.results[0];  
                    const posterUrl = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : 'https://via.placeholder.com/220x330?text=No+Image';
                    const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : "Unknown Year";
                    const rating = movie.vote_average ? movie.vote_average.toFixed(1) : "N/A";
                    document.getElementById(`movie-${index}`).innerHTML = `
                        <img src="${posterUrl}" alt="${movieTitle}" class="movie-poster">
                        <div class="movie-title">${movieTitle} (${releaseYear})</div>
                        <div class="character-name">as ${characterName}</div>
                        <div class="movie-rating">⭐ ${rating}</div>
                    `;
                }
            } catch (error) {
                console.error("Error fetching movie details:", error);
            }
        }

        async function loadMovies() {
            const actorId = await fetchActorId();
            if (!actorId) return;
            const movieCredits = await fetchActorMovies(actorId);
            movieTitles.forEach((movieTitle, index) => {
                fetchMovieData(movieTitle, index + 1, movieCredits);
            });
        }

        function showMovieDetails(movieTitle) {
            window.location.href = `/movie/${encodeURIComponent(movieTitle)}`;
        }

        loadMovies();
    </script>
    	<script src="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@7.2.0/dist/js/autoComplete.min.js"></script>
        <script type="text/javascript" src="{{url_for('static', filename='autocomplete.js')}}"></script>
      
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script type="text/javascript" src="{{url_for('static', filename='recommend.js')}}"></script>
</body>
</html>
