services:
  # 1. Backend Flask API Web Service
  - type: web
    name: movie-recommender-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
      - key: TMDB_API_KEY
        value: fce0af3409e6113c9b3c75aaf49341bb

  # 2. Frontend React Vite Static Site
  - type: web
    name: movie-recommender-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: movie-recommender-backend
          property: host
